version: v1.0
name: Deploy to npmjs
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Deploy to npmjs
    task:
      jobs:
        - name: Deploy
          commands:
            - checkout
            - git submodule init
            - git submodule update
            - sem-version java 17
            - wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O ~/android-commandline-tools.zip
            - mkdir -p ~/android-sdk/
            - unzip ~/android-commandline-tools.zip -d ~/android-sdk/cmdline-tools/
            - mv ~/android-sdk/cmdline-tools/cmdline-tools/ ~/android-sdk/cmdline-tools/latest
            - export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
            - yes | sdkmanager "ndk;29.0.14206865"
            - export PATH=$PATH:~/android-sdk/ndk/29.0.14206865/
            - sem-version node 12
            - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            - npm install
            - npm publish --access=public
      secrets:
        - name: npmjs
